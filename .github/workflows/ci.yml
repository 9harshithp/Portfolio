name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Validate & Playwright Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax validation
        run: |
          node --check app.js
          node --check studio.js
          node --check tests/portfolio.spec.mjs

      - name: HTML validation
        run: npx -y html-validate index.html

      - name: Validate sitemap, robots.txt, canonical, JSON-LD, and local assets
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET

          # 1. Sitemap XML validation
          tree = ET.parse('sitemap.xml')
          root = tree.getroot()
          locs = [el.text for el in root.iter() if el.tag.endswith('loc')]
          assert 'https://portfolio-bay-three-10.vercel.app/' in locs, f'Unexpected sitemap locs: {locs}'
          print('sitemap.xml valid:', locs)

          # 2. robots.txt validation
          robots = open('robots.txt', encoding='utf-8').read()
          assert 'User-agent: *' in robots
          assert 'Allow: /' in robots
          assert 'Sitemap: https://portfolio-bay-three-10.vercel.app/sitemap.xml' in robots
          print('robots.txt valid')

          # 3. Canonical URL and JSON-LD validation
          html = open('index.html', encoding='utf-8').read()
          assert '<link rel="canonical" href="https://portfolio-bay-three-10.vercel.app/">' in html, 'Missing or invalid canonical URL'
          assert 'noindex' not in html.lower(), 'Unexpected noindex directive'
          assert 'G-NJ0QBENB9W' in html, 'Missing GA4 Measurement ID'
          assert os.path.exists('google57bc4c8b8289e9c9.html'), 'Missing GSC verification file'

          m = re.search(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          assert m, 'Missing JSON-LD script'
          ld = json.loads(m.group(1))
          types = [item.get('@type') for item in ld.get('@graph', [])]
          for expected in ('WebSite', 'ProfilePage', 'Person', 'ItemList'):
              assert expected in types, f'Missing {expected} in JSON-LD @graph'
          item_list = next(i for i in ld['@graph'] if i.get('@type') == 'ItemList')
          assert len(item_list.get('itemListElement', [])) == 8, 'Expected 8 projects in JSON-LD ItemList'
          print('JSON-LD valid:', types)
          EOF

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run Playwright regression tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/dev/null 2>&1 &
          SRV_PID=$!
          trap "kill $SRV_PID 2>/dev/null || true" EXIT
          sleep 1
          node tests/portfolio.spec.mjs

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Lighthouse audits (Mobile & Desktop)
        run: |
          mkdir -p .lighthouseci
          python3 -m http.server 4173 --bind 127.0.0.1 >/dev/null 2>&1 &
          SRV_PID=$!
          trap "kill $SRV_PID 2>/dev/null || true" EXIT
          sleep 1
          npx -y lighthouse http://127.0.0.1:4173/ --output=json --output=html --output-path=.lighthouseci/mobile --chrome-flags="--headless=new --no-sandbox" --quiet
          npx -y lighthouse http://127.0.0.1:4173/ --preset=desktop --output=json --output=html --output-path=.lighthouseci/desktop --chrome-flags="--headless=new --no-sandbox" --quiet
          node - << 'EOF'
          const fs = require('fs');
          const rows = [];
          for (const mode of ['mobile', 'desktop']) {
            const r = JSON.parse(fs.readFileSync(`.lighthouseci/${mode}.report.json`, 'utf8'));
            const s = k => Math.round((r.categories[k]?.score || 0) * 100);
            const a = r.audits;
            rows.push(`| ${mode} | ${s('performance')} | ${s('accessibility')} | ${s('best-practices')} | ${s('seo')} | ${a['largest-contentful-paint']?.displayValue || '-'} | ${a['cumulative-layout-shift']?.displayValue || '-'} | ${a['total-blocking-time']?.displayValue || '-'} |`);
          }
          const summary = [
            '### Lighthouse CI Report',
            '',
            '| Preset | Performance | Accessibility | Best Practices | SEO | LCP | CLS | TBT |',
            '| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |',
            ...rows
          ].join('\n');
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          }
          EOF

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/

